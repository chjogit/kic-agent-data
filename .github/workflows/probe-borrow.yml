# 임시 (10-29): 총차입금 계정 모양 점검. DB 에 쓰지 않고 결과를 이 브랜치 PR 댓글로 올립니다. 병합 전에 지웁니다.
name: probe-borrow
on:
  push:
    branches: [claude/total-borrowings]
    paths: [".github/workflows/probe-borrow.yml", "kic_data/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 점검
        run: |
          git fetch -q origin main && mkdir -p m && git --work-tree=m checkout origin/main -- kic_data && git reset -q
          cat > cmp.py <<'PY'
          import sys
          from kic_data import db, exposure_parse as ep
          from kic_data.collectors import dart_doc
          from kic_data.http_util import make_session
          print("module:", ep.__file__, ep.PARSER_VERSION)
          s = make_session()
          with db.connect() as conn:
              cos = {c[1]: c for c in db.list_companies(conn, "KR")}
              rep = db.annual_reports(conn, cos["003490"][0])[0][0]
          files = dart_doc.fetch_document(s, rep)
          r = ep.extract(files)
          print([(m.metric, m.currency, m.value, m.table_index, m.file) for m in r["metrics"] if m.metric in ("fx_sens", "ir_sens")])
          for name, text in files.items():
              for t in dart_doc.tables_from_xml(text, name):
                  if ep._is_sensitivity(t):
                      print("후보", name, t.index, t.unit, (t.extra or {}).get("section"), "|", t.context[-120:], "|", t.text(4)[:300].replace("\n", " / "))
          PY
          (cd m && cp ../cmp.py . && cp ../requirements.txt . 2>/dev/null; python cmp.py) > probe_cmp_main.txt 2>&1 || true
          python cmp.py > probe_cmp.txt 2>&1 || true
      - name: PR 댓글로 올리기
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          [ -z "$pr" ] && { echo "PR 없음"; exit 0; }
          for f in probe_*.txt; do
            { echo "### probe ${f#probe_}"; echo '```'; head -c 60000 "$f"; echo; echo '```'; } > body.md
            gh pr comment "$pr" --body-file body.md
          done
