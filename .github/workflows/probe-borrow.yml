# 임시 (10-29): 총차입금 계정 모양 점검. DB 에 쓰지 않고 결과를 이 브랜치 PR 댓글로 올립니다. 병합 전에 지웁니다.
name: probe-borrow
on:
  push:
    branches: [claude/total-borrowings]
    paths: [".github/workflows/probe-borrow.yml", "kic_data/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 점검
        run: |
          cat > p.py <<'PY'
          from kic_data import cli, db
          from kic_data.collectors import dart_periodic as dp
          from kic_data.http_util import make_session
          want = "005930,000660,005380,051910,003490,015760,011200,011170,068270,035420,105560,007070,051600,035250,018260,030000,097950,028260".split(",")
          s = make_session()
          with db.connect() as conn:
              cos = {c[1]: c for c in db.list_companies(conn, "KR") if c[1] in want and c[3]}
          for t in want:
              c = cos.get(t)
              if not c:
                  print(t, "없음"); continue
              for year, code in [(2025, "11011"), (2026, "11012")]:
                  try:
                      rows = cli._fetch_periodic(s, "borrowing", c[3], year, code)
                  except RuntimeError as e:
                      print(t, c[2], year, code, e); continue
                  tot = sum(r["amount"] for r in rows if dp.borrow_kind(r["account_nm"].split("#")[0]) != "bank")
                  print(f"{t} {c[2]} {year}/{code} {rows[0]['fs_div'] if rows else '-'} 합 {float(tot)/1e8:,.0f}억")
                  for r in rows:
                      print(f"    {dp.borrow_kind(r['account_nm'].split('#')[0]):10s} {r['account_nm']:30s} {r['account_id']:55s} {float(r["amount"])/1e8:>12,.0f}억")
              fs = cli._fs_cache and next(iter(cli._fs_cache.values()))
              other = sorted({r["account_nm"] for r in (fs or []) if r.get("sj_div") == "BS" and any(w in r["account_nm"] for w in ("차입", "사채", "리스부채", "금융부채"))} - {r["account_nm"].split("#")[0] for r in rows})
              if other:
                  print("    (안 고른 비슷한 이름)", ", ".join(other))
          PY
          python p.py > probe_borrow.txt 2>&1 || true
          cat > r.py <<'PY'
          from kic_data import db
          from kic_data.collectors import dart
          from kic_data.http_util import make_session
          s = make_session()
          with db.connect() as conn:
              cos = {c[1]: c for c in db.list_companies(conn, "KR")}
          for t in ("015760", "068270", "018260", "035250"):
              rows = [r for r in dart.fetch_financials(s, cos[t][3], 2026, report_code="11012", fs_div="CFS") if r["sj_div"] == "BS"]
              print(f"\n## {t} {cos[t][2]} 재무상태표 {len(rows)}행")
              for r in rows:
                  a = r["amount"]
                  print(f"  {r['account_nm'][:40]:40s} {r['account_id'][:60]:60s} {float(a)/1e8 if a is not None else 0:>12,.0f}억")
          PY
          python r.py > probe_bs.txt 2>&1 || true
          cat > q.py <<'PY'
          from kic_data import db, exposure_parse as ep
          from kic_data.collectors import dart_doc
          from kic_data.http_util import make_session
          s = make_session()
          T = ("035250,051600,007070,018260,030000,004000,012750,"
               "005930,000660,005380,000270,051910,006400,010950,096770,003490,034020,015760,017670,030200,033780,097950,271560,028260,009540,047050,011170").split(",")
          with db.connect() as conn, conn.cursor() as cur:
              cos = {c[1]: c for c in db.list_companies(conn, "KR")}
              old, reps = {}, {}
              for t in T:
                  cid = cos[t][0]
                  reps[t] = db.annual_reports(conn, cid)
                  cur.execute("SELECT metric, currency, value FROM core.report_exposure WHERE company_id=%s AND metric IN ('fx_sens','ir_sens')", [cid])
                  old[t] = {(m, c): float(v) for m, c, v in cur.fetchall()}
                  cur.execute("SELECT found FROM ops.report_parse WHERE company_id=%s ORDER BY fiscal_year DESC LIMIT 1", [cid])
                  r = cur.fetchone(); old[t]["found"] = r[0] if r else None
              conn.commit()
          for t in T:
              files = dart_doc.fetch_document(s, reps[t][0][0])
              r = ep.extract(files)
              new = {(m.metric, m.currency): m.value for m in r["metrics"] if m.metric in ("fx_sens", "ir_sens")}
              o = {k: v for k, v in old[t].items() if k != "found"}
              diff = {k: (o.get(k), new.get(k)) for k in set(o) | set(new) if o.get(k) != new.get(k)}
              print(f"{t} {cos[t][2]} found(old)={old[t]['found']} found(new)={r['found']}")
              if diff:
                  print("   바뀐 값:", diff)
              print("   risk_text:", r["risk_text"][:160].replace("\n", " "))
          PY
          python q.py > probe_doc.txt 2>&1 || true
      - name: PR 댓글로 올리기
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          [ -z "$pr" ] && { echo "PR 없음"; exit 0; }
          for f in probe_*.txt; do
            { echo "### probe ${f#probe_}"; echo '```'; head -c 60000 "$f"; echo; echo '```'; } > body.md
            gh pr comment "$pr" --body-file body.md
          done
