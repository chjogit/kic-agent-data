# 임시 (10-29): 총차입금 계정 모양 점검. DB 에 쓰지 않고 결과를 이 브랜치 PR 댓글로 올립니다. 병합 전에 지웁니다.
name: probe-borrow
on:
  push:
    branches: [claude/total-borrowings]
    paths: [".github/workflows/probe-borrow.yml", "kic_data/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 점검
        run: |
          cat > p.py <<'PY'
          from kic_data import cli, db
          from kic_data.collectors import dart_periodic as dp
          from kic_data.http_util import make_session
          want = "005930,000660,005380,051910,003490,015760,011200,011170,068270,035420,105560,007070,051600,035250,018260,030000,097950,028260".split(",")
          s = make_session()
          with db.connect() as conn:
              cos = {c[1]: c for c in db.list_companies(conn, "KR") if c[1] in want and c[3]}
          for t in want:
              c = cos.get(t)
              if not c:
                  print(t, "없음"); continue
              for year, code in [(2025, "11011"), (2026, "11012")]:
                  try:
                      rows = cli._fetch_periodic(s, "borrowing", c[3], year, code)
                  except RuntimeError as e:
                      print(t, c[2], year, code, e); continue
                  tot = sum(r["amount"] for r in rows if dp.borrow_kind(r["account_nm"].split("#")[0]) != "bank")
                  print(f"{t} {c[2]} {year}/{code} {rows[0]['fs_div'] if rows else '-'} 합 {float(tot)/1e8:,.0f}억")
                  for r in rows:
                      print(f"    {dp.borrow_kind(r['account_nm'].split('#')[0]):10s} {r['account_nm']:30s} {r['account_id']:55s} {float(r["amount"])/1e8:>12,.0f}억")
              fs = cli._fs_cache and next(iter(cli._fs_cache.values()))
              other = sorted({r["account_nm"] for r in (fs or []) if r.get("sj_div") == "BS" and any(w in r["account_nm"] for w in ("차입", "사채", "리스부채", "금융부채"))} - {r["account_nm"].split("#")[0] for r in rows})
              if other:
                  print("    (안 고른 비슷한 이름)", ", ".join(other))
          PY
          python p.py > probe_borrow.txt 2>&1 || true
      - name: PR 댓글로 올리기
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          [ -z "$pr" ] && { echo "PR 없음"; exit 0; }
          for f in probe_*.txt; do
            { echo "### probe ${f#probe_}"; echo '```'; head -c 60000 "$f"; echo; echo '```'; } > body.md
            gh pr comment "$pr" --body-file body.md
          done
