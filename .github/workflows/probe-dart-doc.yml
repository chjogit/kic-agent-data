# 임시: 사업보고서 원문 표 모양 확인용 (claude/dart-doc-probe 브랜치에서만 실행, main 에 합치지 않음)
name: probe-dart-doc
on:
  push:
    branches: [claude/dart-doc-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m kic_data.cli probe-dart-doc --extract --show-misses --tickers 000880,000210,004000,006280,000720,003490,035420,051910,066570,096770,017670,105560
