name: probe-flows (임시)
on:
  push:
    branches: [claude/project-thread-8cdwmt]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - env:
          FSC_API_KEY: ${{ secrets.FSC_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from kic_data.http_util import make_session
          from kic_data.collectors import investor_flow, lending
          s = make_session()
          rows = investor_flow.fetch_flows(s, "005930", date.today() - timedelta(days=400))
          print("naver flows", len(rows), rows[0] if rows else None, rows[-1] if rows else None)
          for d in (date(2026, 10, 23), date(2026, 10, 24), date(2021, 4, 1)):
              r = lending.fetch_day(s, d)
              sam = [x for x in r if x["ticker"] == "005930"]
              print("lending", d, len(r), sam[:1])
          PY
