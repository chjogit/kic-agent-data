name: kic-alerts
# 품질 알림(DB 용량·가격보다 늦은 데이터·수집 실행 멈춤·API 오류)을 GitHub Issue 로 동기화합니다.
# 수집(kic-collect)이 멈춰도 알릴 수 있도록 수집과 별도로 돕니다.
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
concurrency:
  group: kic-alerts
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  OPINION_DATABASE_URL: ${{ secrets.OPINION_DATABASE_URL }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  PYTHONIOENCODING: utf-8
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m kic_data.cli alert-sync
      # DB 접속이 막히면 위 단계도 접속 단계에서 죽어 DB 에 실패를 못 남깁니다 → DB 없이 GitHub Issue 1개로 알림 (#86).
      # 접속이 정상인 다른 이유의 실패면 아무것도 하지 않고, 접속이 돌아오면 이슈를 닫습니다. 비밀값·접속 주소는 이슈에 쓰지 않습니다.
      - name: DB 접속 불가 알림 (실패 시)
        if: ${{ failure() }}
        run: python -m kic_data.outage_notice failure --workflow kic-alerts
      - name: DB 접속 불가 이슈 닫기 (성공 시)
        if: ${{ success() }}
        run: python -m kic_data.outage_notice recovered
