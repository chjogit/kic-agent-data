# 임시: 차입 조건·매출채권 API 와 원문 추출기를 실제 응답으로 확인 (이 브랜치에서만, PR 전에 지움). DB 는 읽기만.
name: probe-dart-debt
on:
  push:
    branches: [claude/project-thread-7to4o3]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m kic_data.cli probe-dart-debt --tickers 000660,005930,015760
      - run: python -m kic_data.cli probe-dart-doc --extract --tickers 005930,000660,005380,051910,096770,015760,010950
