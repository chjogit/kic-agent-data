# 임시 (10-29): 위험회피회계 v4 실데이터 점검. DB 에 쓰지 않음. 병합 전에 지웁니다.
name: probe-hedge4
on:
  push:
    branches: [claude/hedge-acct-sentence]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 점검
        run: |
          cat > h.py <<'PY'
          from kic_data import db, exposure_parse as ep
          from kic_data.collectors import dart_doc
          from kic_data.http_util import make_session
          s = make_session()
          T = "005930,105560,005380,003490,051600,051910,017670,000660,010950,015760".split(",")
          with db.connect() as conn:
              cos = {c[1]: c for c in db.list_companies(conn, "KR")}
              reps = {t: db.annual_reports(conn, cos[t][0])[0][0] for t in T}
          for t in T:
              tables = []
              for name, text in dart_doc.fetch_document(s, reps[t]).items():
                  tables += dart_doc.tables_from_xml(text, name)
              m = ep.fx_hedge_accounting(tables)
              print(t, cos[t][2], "→", ("있음 #%s %s | %s" % (m.table_index, m.file, m.evidence[:220])) if m else "없음")
          PY
          python -u h.py > probe_hedge4.txt 2>&1 || true
      - name: PR 댓글로 올리기
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          [ -z "$pr" ] && { echo "PR 없음"; exit 0; }
          { echo "### probe hedge4"; echo '```'; head -c 60000 probe_hedge4.txt; echo; echo '```'; } > body.md
          gh pr comment "$pr" --body-file body.md
