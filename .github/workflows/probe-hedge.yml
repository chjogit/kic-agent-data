# 임시 (10-29): 헤지 계약·변동금리 차입 표 모양 점검. DB 에 쓰지 않고 결과를 이 브랜치 PR 댓글로 올립니다.
# 파서를 만든 뒤 이 파일은 지웁니다 (예전 probe-dart-doc 임시 워크플로와 같은 방식).
name: probe-hedge
on:
  push:
    branches: [claude/hedge-debt-terms]
    paths: [".github/workflows/probe-hedge.yml", "kic_data/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 점검
        run: |
          for t in 005930 005380 051910 017670 010950 003490 034020 000660; do
            python -m kic_data.cli probe-dart-doc --tickers "$t" --keys 헤지계약,변동금리차입 \
              --max-tables 6 --max-rows 12 --max-chars 1500 > "probe_$t.txt" 2>&1 || true
          done
      - name: PR 댓글로 올리기
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          [ -z "$pr" ] && { echo "PR 없음"; exit 0; }
          for f in probe_*.txt; do
            { echo "### probe ${f#probe_}"; echo '```'; head -c 60000 "$f"; echo; echo '```'; } > body.md
            gh pr comment "$pr" --body-file body.md
          done
