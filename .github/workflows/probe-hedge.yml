# 임시 (10-29): 헤지 계약·변동금리 차입 표 모양 점검. DB 에 쓰지 않고 결과를 이 브랜치 PR 댓글로 올립니다.
# 파서를 만든 뒤 이 파일은 지웁니다 (예전 probe-dart-doc 임시 워크플로와 같은 방식).
name: probe-hedge
on:
  push:
    branches: [claude/hedge-debt-terms]
    paths: [".github/workflows/probe-hedge.yml", "kic_data/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 점검
        run: |
          # v2 추출기 결과 (DB 에 쓰지 않음): 업종이 다른 20개사
          python -m kic_data.cli probe-dart-doc --extract \
            --tickers 005930,000660,005380,000270,051910,006400,010950,096770,003490,034020,015760,017670,030200,033780,097950,271560,028260,009540,047050,011170 \
            > probe_extract.txt 2>&1 || true
      - name: PR 댓글로 올리기
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          [ -z "$pr" ] && { echo "PR 없음"; exit 0; }
          for f in probe_*.txt; do
            { echo "### probe ${f#probe_}"; echo '```'; head -c 60000 "$f"; echo; echo '```'; } > body.md
            gh pr comment "$pr" --body-file body.md
          done
