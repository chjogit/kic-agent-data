# 임시: KOSPI 200·일괄 조회 API 응답 확인 (DB 에 쓰지 않음). PR 전에 지웁니다.
name: kic-probe
on:
  push:
    branches: [claude/kospi200-universe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FSC_API_KEY: ${{ secrets.FSC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts_probe_urls.py
