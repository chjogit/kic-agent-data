# kic-collect 를 매시 15분에 실행시키는 Cloudflare Worker (GitHub 예약 실행의 20~40분 지연을 피하려고)
# 비밀값 GITHUB_TOKEN 은 이 파일에 쓰지 않고 `npx wrangler secret put GITHUB_TOKEN` 으로만 넣습니다.
name = "kic-collect-trigger"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false   # 공개 URL 없음 (예약 실행만)

[triggers]
crons = ["15 * * * *"]   # 매시 15분 (Cloudflare cron 은 UTC 지만 분 단위라 KST 와 같은 15분)

[observability]
enabled = true   # 대시보드에서 실행 기록·오류 확인
